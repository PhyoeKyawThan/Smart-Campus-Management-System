<div class="w-full h-full rounded-xl shadow-xl p-5 overflow-scroll" id="dashboard-container">
    <header class="flex flex-row justify-between w-full">
        <h1 class="font-bold dash_color mb-2">DASHBOARD</h1>
        <div class="text-right">
        </div>
    </header>
    <h1 class="font-bold text-2xl text-slate-600 text-center">Today's Rate</h1>
    <section class="flex flex-row justify-between w-full mb-2" id="rate">
        <div class="percentage bg-secondary-dash shadow-2xl p-5 text-center w-1/4 m-2" id="student">
            <h1 class="text-xl font-bold color-primary">Student</h1>
            <span class="font-bold text-slate-200" id="student"></span>
        </div>
        <div class="percentage bg-secondary-dash shadow-2xl p-5 text-center w-1/4 m-2" id="teacher">
            <h1 class="text-xl font-bold color-primary">Teacher</h1>
            <span class="font-bold text-slate-200" id="teacher"></span>
        </div>
        <div class="percentage bg-secondary-dash shadow-2xl p-5 text-center w-1/4 m-2" id="staff">
            <h1 class="text-xl font-bold color-primary">Staff</h1>
            <span class="font-bold text-slate-200" id="staff"> </span>
        </div>
        <div class="percentage bg-secondary-dash shadow-2xl p-5 text-center w-1/4 m-2" id="guest">
            <h1 class="text-xl font-bold color-primary">Guest</h1>
            <span class="font-bold text-slate-200" id="guest"></span>
        </div>
    </section>
    <section id="today-passed">
        <!-- <div class="flex flex-row">
            <h1 class="p-2 text-xl font-bold text-slate-600">Last Pass </h1>
            <select name="" id="in-out-option" onchange="handleInOut(event)" class="p-2 rounded-md shadow-xl font-bold">
                <option value="in_times" selected>IN</option>
                <option value="out_times">OUT</option>
            </select>
        </div> -->
        <h1 class="text-2xl font-bold mb-2">Live Campus Check</h1>
        <table class="w-full">
            <thead>
                <tr>
                    <th class="text-center p-2 border-b border-slate-400">#</th>
                    <th class="text-center p-2 border-b border-slate-400">PROFILE</th>
                    <th class="text-center p-2 border-b border-slate-400">NAME</th>
                    <th class="text-center p-2 border-b border-slate-400">IS_WHO</th>
                    <th class="text-center p-2 border-b border-slate-400">IN_OUT</th>
                    <th class="text-center p-2 border-b border-slate-400">TIME</th>
                    <th class="text-center p-2 border-b border-slate-400">View</th>
                </tr>
            </thead>
            <tbody>


            </tbody>
        </table>
    </section>
    <!-- times pop-up -->
    <div id="time-popup" class="hidden fixed inset-0 bg-gray-200 bg-opacity-75 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-1/3">
            <h2 class="text-xl font-bold mb-4">Times</h2>
            <div id="time-details" class="mb-4">
                <!-- Times details will be injected here -->
            </div>
            <button onclick="closePopup()" class="bg-red-500 text-white py-2 px-4 rounded">Close</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/dashboard.js' )}}"></script>
<script src="{{ url_for('static', filename='js/ViewInfo.js' )}}"></script>
