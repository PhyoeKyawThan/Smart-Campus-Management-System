 <!-- Card Container -->
 <div class="max-w-sm mx-auto bg-white shadow-lg rounded-lg overflow-hidden">
    <!-- Student Picture -->
    <img id="student-picture" class="w-full h-48 object-cover" alt="Student Picture">
    
    <!-- Student Details -->
    <div class="p-6">
        <h2 id="student-name" class="text-2xl font-semibold text-gray-800"></h2>
        <p class="text-gray-600"><strong>Student ID:</strong> <span id="student-id"></span></p>
        <p class="text-gray-600"><strong>Roll No:</strong> <span id="student-roll-no"></span></p>
        <p class="text-gray-600"><strong>Current Semester:</strong> <span id="student-semester"></span></p>
        <p class="text-gray-600"><strong>NRC:</strong> <span id="student-nrc"></span></p>
        <p class="text-gray-600"><strong>Father's Name:</strong> <span id="student-father-name"></span></p>
        <p class="text-gray-600"><strong>Address:</strong> <span id="student-address"></span></p>
        <p class="text-gray-600"><strong>Phone No:</strong> <span id="student-phone-no"></span></p>
        <p class="text-gray-600"><strong>Email:</strong> <span id="student-email"></span></p>
        <p class="text-gray-600"><strong>Birth Date:</strong> <span id="student-birth-date"></span></p>
        <p class="text-gray-600"><strong>Register Date:</strong> <span id="student-register-date"></span></p>
    </div>
</div>
