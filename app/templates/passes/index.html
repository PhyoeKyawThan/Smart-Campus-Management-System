<!-- student list -->
<div class="w-full h-full rounded-xl shadow-xl p-5 overflow-scroll" id="pass-container">
  <header class="flex flex-row justify-between w-full">
    <h1 class="font-bold text-slate-400 mb-2">Passes</h1>
    <div class="text-right">
    </div>
  </header>

  <section class="flex flex-row justify-between w-full mb-2">
    <select name="" id="get-who" class="w-fit p-2 font-bold shadow-2xl bg-slate-200 rounded-md"
      onchange="handleClick(event)">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="staff">Staff</option>
    </select>
    <select name="" id="in-out-option" onchange="handleInOut(event)"
      class="ml-4 p-2 font-bold bg-slate-300 shadow-2xl rounded-md">
      <option value="in_times" selected>IN</option>
      <option value="out_times">OUT</option>
    </select>
    <div class="w-full flex justify-end ">
      <label for="date" class="p-2 font-bold">Filter by date: </label>
      <input type="date" id="date" onchange="search_by_date(event)" class="p-2 rounded-md shadow-2xl">
    </div>
  </section>
  <section class="w-full h-4/5 bg-slate-200 rounded-xl overflow-scroll">
    <table class="w-full">
      <thead>
        <tr>
          <th class="text-center p-2 border-b border-slate-400">#</th>
          <th class="text-center p-2 border-b border-slate-400">PROFILE</th>
          <th class="text-center p-2 border-b border-slate-400">NAME</th>
          <th class="text-center p-2 border-b border-slate-400">IS_WHO</th>
          <th class="text-center p-2 border-b border-slate-400">TIME</th>
          <th class="text-center p-2 border-b border-slate-400">Actions</th>
        </tr>
      </thead>
      <tbody>


      </tbody>
    </table>
  </section>
  <!-- times pop-up -->
  <div id="time-popup" class="hidden fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg shadow-lg w-1/3">
      <h2 class="text-xl font-bold mb-4">Times</h2>
      <div id="time-details" class="mb-4">
        <!-- Times details will be injected here -->
      </div>
      <button onclick="closePopup()" class="bg-red-500 text-white py-2 px-4 rounded">Close</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/passes.js' )}}"></script>
<script src="{{ url_for('static', filename='js/ViewInfo.js' )}}"></script>
