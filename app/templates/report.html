<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report</title>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* background-color: #f4f4f4; */
            color: #333;
            padding: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #2c3e50;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f4;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #3498db;
            color: white;
            font-size: 1.2em;
            font-weight: normal;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1c40f;
            color: #fff;
        }

        .col img {
            width: 60px; /* Set image size */
            height: 60px; /* Set image size */
            border-radius: 50%;
            border: 2px solid #3498db;
        }

        .header-img {
            /* margin: 0 auto 20px; */
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #3498db;
        }
        div{
            text-align: center;
        }
        
    </style>
</head>

<body>
    <!-- <div><img class="header-img" src="http://127.0.0.1:5000/static/images/default.png" alt="Logo"></div> -->
    <h1>Rocky Rity Report for {{ report_date }}</h1>
    <table class="data-container">
        <thead>
            <tr>
                <th class="col">#</th>
                <th class="col">IMAGE</th>
                <th class="col">NAME</th>
                <th class="col">IS_WHO</th>
                <th class="col">IN_OUT</th>
                <th class="col">TIME</th>
            </tr>
        </thead>
        <tbody>
            {% for time in times %}
            <tr>
                <td class="col">{{ loop.index }}</td>
                <td class="col">
                    <img src="http://127.0.0.1:5000/static/profiles/{{ time['who'] }}/{{ time['profile'] }}" alt="Profile Image">
                </td>
                <td class="col">{{ time["name"] }}</td>
                <td class="col">{{ time["who"] }}</td>
                <td class="col">{{ time["in_out"] }}</td>
                <td class="col">{{ time["time"] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
