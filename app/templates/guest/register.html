<section id="add-guest" class=" w-full bg-slate-200 flex flex-row justify-center space-around p-2">
    <label for="form-image" class="h-20 w-20 border-2 border-slate-800 rounded-md">
        <img src="" id="imagePreview" alt="" class="w-full h-full">
    </label>
    <form id="guest-add-form">
        <input type="file" name="guest-file" id="form-image" onchange="previewImage()" hidden>
    <input type="text" name="name" id="guest-name" placeholder="Guest Name..." class="shadow-xl p-2 rounded-md text-slate-800 text-center bg-slate-200 m-2">
    <input type="number" name="" id="people-count" class="shadow-xl p-2 rounded-md text-slate-800 text-center bg-slate-200" placeholder="People Count">
    <input type="button" value="Add Guest" class="p-2 font-bold bg-slate-400 text-white shadow-xl p-2 m-2 rounded-md hover:bg-slate-600 cursor-pointer" onclick="addNewGuest()">
    </form>
</section>
