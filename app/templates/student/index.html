<!-- student list -->
<div class="w-full h-full rounded-xl shadow-xl p-5 " id="student-container">
  <h1 class="font-bold text-slate-400">Students</h1>
  <div class="w-full flex justify-end">
    <input type="text" name="" id="roll-no" placeholder="ROLL NO." class="p-1 rounded-md m-2 text-sm">
  </div>
  <section class="w-full h-4/5 bg-slate-200 rounded-xl overflow-scroll">
    <table class="w-full">
      <thead>
        <tr>
          <th class="text-center p-2 border-b border-slate-400">#</th>
          <th class="text-center p-2 border-b border-slate-400">Profile</th>
          <th class="text-center p-2 border-b border-slate-400">Name</th>
          <th class="text-center p-2 border-b border-slate-400">Semester</th>
          <th class="text-center p-2 border-b border-slate-400">Roll No.</th>
          <th class="text-center p-2 border-b border-slate-400">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for student in students %}
        <tr>
          <td class="text-center font-bold">{{ loop.index }}</td>
          <td class="text-center font-bold"><img
              src="{{ student['picture_uri'] }}" alt=""
              class="block w-20 h-20 bg-slate-300"></td>
          <td class="text-center font-bold">{{ student["name"] }}</td>
          <td class="text-center font-bold">{{ student["current_semester"] }}</td>
          <td class="text-center font-bold">{{ student["roll_no"] }}</td>
          <td class="text-center font-bold flex flex-row justify-center space-x-2 aligns-center p-2">
            <a onclick="show_form('student-container', 'student-update-form', get_student_update_form, event)" data-id="{{ student['student_id'] }}"
              class="p-2 text-slate-200 rounded-md bg-sky-400 flex items-center justify-center w-fit">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path
                  d="M17.414 2.586a2 2 0 00-2.828 0L14 3.172l2.828 2.828 1.586-1.586a2 2 0 000-2.828zM4 13v3h3l9.293-9.293-2.828-2.828L4 13zm-1 4a1 1 0 001 1h3a1 1 0 001-1v-1H4v1z" />
              </svg>
            </a>
            <a href="" class="p-2 text-slate-200 rounded-md bg-green-600 flex items-center justify-center w-fit">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 3a7 7 0 100 14 7 7 0 000-14zm1 8H9v2h2v-2zm0-4H9v2h2V7z" />
              </svg>
            </a>
            <a href="" class="p-2 text-slate-200 rounded-md bg-red-600 flex items-center justify-center w-fit">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                  d="M6 2a1 1 0 011-1h6a1 1 0 011 1v1H6V2zM5 4h10v1H5V4zm2 1v10a1 1 0 001 1h4a1 1 0 001-1V5H7z"
                  clip-rule="evenodd" />
              </svg>
            </a>
          </td>
        </tr>
        {% endfor %}

      </tbody>
    </table>
  </section>
</div>
<!-- update form -->
<section class="hidden w-full h-full rounded-xl shadow-xl p-5 overflow-scroll" id="student-update-form">
  <header class="text-2xl font-bold mb-4">Update Form</header>
  <form class="form" id="updateForm">
    <h2 id="alert-container" class="text-red-500 mb-4"></h2>
    <div class="flex justify-between">
      <div class="w-1/2 mr-2">
        <div class="mb-4">
          <label for="form-image" class="block text-sm font-medium text-gray-700">Image:</label>
          <div class="relative w-32 h-32">
            <img id="imagePreview" src="" alt="Default Image"
              class="object-cover w-full h-full rounded-md" />
            <div
              class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50 text-white cursor-pointer">
              <label for="form-image" class="browse-button">Browse</label>
            </div>
          </div>
          <input type="file" id="form-image" name="form-image" accept="image/*" class="hidden" />
        </div>

        <div class="mb-4">
          <label for="studentId" class="block text-sm font-medium text-gray-700">Student ID</label>
          <input type="text" id="studentId" placeholder="Enter your student ID" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" />
        </div>

        <div class="mb-4">
          <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
          <input type="text" id="fullName" placeholder="Enter your full name" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" />
        </div>

        <div class="mb-4">
          <label for="rollNo" class="block text-sm font-medium text-gray-700">Roll No.</label>
          <input type="text" id="rollNo" placeholder="Enter your roll number" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" />
        </div>

        <div class="mb-4">
          <label for="nrc" class="block text-sm font-medium text-gray-700">NRC</label>
          <input type="text" id="nrc" placeholder="Enter your NRC" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" />
        </div>

        <div class="mb-4">
          <label for="currentSemester" class="block text-sm font-medium text-gray-700">Current Semester</label>
          <select id="currentSemester" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            <option value="">Select Current Semester</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>
      </div>

      <div class="w-1/2 ml-2">
        <div class="mb-4">
          <label for="fathersName" class="block text-sm font-medium text-gray-700">Father’s Name</label>
          <input type="text" id="fathersName" placeholder="Enter your father’s name" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" />
        </div>

        <div class="mb-4">
          <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
          <input type="text" id="address" placeholder="Enter your address" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" />
        </div>

        <div class="mb-4">
          <label for="emailAddress" class="block text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" id="emailAddress" placeholder="Enter your email" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" />
        </div>

        <div class="mb-4">
          <label for="phoneNumber" class="block text-sm font-medium text-gray-700">Phone Number</label>
          <input type="text" id="phoneNumber" placeholder="Enter your phone number" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" />
        </div>

        <div class="mb-4">
          <label for="birthDate" class="block text-sm font-medium text-gray-700">Birth Date</label>
          <input type="date" id="birthDate" required
            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" />
        </div>
      </div>
    </div>

    <div class="flex justify-end space-x-4 mt-6">
      <button id="cancel-button" onclick="close_form('student-container', 'student-update-form')"
        class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">Cancel</button>
      <button id="submit-button" type="button" onclick="validateForm(event)"
        class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">Update</button>
    </div>
  </form>
</section>

<script src="{{ url_for('static', filename='js/student.js' )}}"></script>
